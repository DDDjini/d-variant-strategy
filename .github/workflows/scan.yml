name: S-28 A4 scan

on:
  schedule:
    - cron: '7 */4 * * *'   # 每 4 小时（UTC），与本地定时任务同档位
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write           # 回写 live_state.json 去重

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Load dedup state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'EOF'
          import json, base64, urllib.request, os
          url = 'https://api.github.com/repos/${{ github.repository }}/contents/scripts/live_state.json'
          req = urllib.request.Request(url, headers={
              'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
              'User-Agent': 'trae', 'Accept': 'application/vnd.github+json'})
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  data = json.loads(r.read().decode())
              with open('scripts/live_state.json', 'w', encoding='utf-8') as f:
                  json.dump(json.loads(base64.b64decode(data['content'])), f)
              print('state loaded, sha:', data['sha'])
          except Exception as e:
              print('no state yet:', e)
          EOF

      - name: Scan and notify Feishu
        env:
          MEXC_PROXY: ''    # CI 直连 MEXC，不走本地代理
        run: python scripts/s28_a4_live.py

      - name: Save dedup state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'EOF'
          import json, base64, urllib.request, os
          repo = '${{ github.repository }}'
          token = os.environ['GH_TOKEN']
          path = 'scripts/live_state.json'
          if not os.path.exists(path):
              print('no state file, skip'); raise SystemExit(0)
          content = open(path, 'rb').read()
          url = f'https://api.github.com/repos/{repo}/contents/{path}'
          headers = {'Authorization': f'Bearer {token}', 'User-Agent': 'trae',
                     'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
          remote = None
          req = urllib.request.Request(url, headers=headers)
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  remote = json.loads(r.read().decode())
          except Exception:
              pass
          b64 = base64.b64encode(content).decode()
          if remote and remote.get('content', '').replace('\n', '') == b64:
              print('state unchanged, skip'); raise SystemExit(0)
          payload = {'message': 'update live_state', 'content': b64}
          if remote and remote.get('sha'):
              payload['sha'] = remote['sha']
          req = urllib.request.Request(url, data=json.dumps(payload).encode(),
                                       headers=headers, method='PUT')
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  print('state saved')
          except Exception as e:
              print('state save failed:', e)
          EOF
